<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Poster Display in Library</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background: #d4edda; border-color: #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border-color: #f5c6cb; color: #721c24; }
        .warning { background: #fff3cd; border-color: #ffeaa7; color: #856404; }
        .info { background: #d1ecf1; border-color: #bee5eb; color: #0c5460; }
        button { padding: 10px 15px; margin: 5px; border: none; border-radius: 4px; cursor: pointer; background: #007bff; color: white; }
        .image-test { display: inline-block; margin: 10px; text-align: center; }
        .image-test img { width: 150px; height: 225px; object-fit: cover; border: 1px solid #ddd; }
        .image-test .label { margin-top: 5px; font-size: 12px; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 4px; overflow-x: auto; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖼️ Debug Poster Display in Library</h1>
        <p>This tool will help debug why posters are not displaying in Library.vue</p>

        <div class="test-section">
            <h3>1. Authentication Test</h3>
            <button onclick="testAuth()">Test Authentication</button>
            <div id="auth-result"></div>
        </div>

        <div class="test-section">
            <h3>2. Media API Test</h3>
            <button onclick="testMediaAPI()">Test Media API</button>
            <div id="media-result"></div>
        </div>

        <div class="test-section">
            <h3>3. Poster URL Test</h3>
            <button onclick="testPosterURLs()">Test Poster URLs</button>
            <div id="poster-result"></div>
        </div>

        <div class="test-section">
            <h3>4. Image Loading Test</h3>
            <div id="image-test-area"></div>
        </div>

        <div class="test-section">
            <h3>5. Browser Console Debug</h3>
            <button onclick="enableConsoleDebug()">Enable Console Debug</button>
            <div id="console-result"></div>
        </div>

        <div class="test-section">
            <h3>6. Debug Log</h3>
            <div id="debug-log"></div>
        </div>
    </div>

    <script>
        let token = null;
        let mediaItems = [];

        function log(message, type = 'info') {
            const logDiv = document.getElementById('debug-log');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `test-section ${type}`;
            logEntry.innerHTML = `<strong>[${timestamp}]</strong> ${message}`;
            logDiv.appendChild(logEntry);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(`[${timestamp}] ${message}`);
        }

        async function testAuth() {
            const resultDiv = document.getElementById('auth-result');
            resultDiv.innerHTML = '<p>Testing authentication...</p>';
            
            try {
                log('Testing authentication...', 'info');
                
                const response = await fetch('http://localhost:8000/api/v1/auth/login/access-token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: 'test@example.com',
                        password: 'testpass123'
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    token = data.access_token;
                    localStorage.setItem('access_token', token);
                    
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h4>✅ Authentication Successful</h4>
                            <p>Token stored: ${token.substring(0, 50)}...</p>
                        </div>
                    `;
                    log('Authentication successful', 'success');
                    return token;
                } else {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h4>❌ Authentication Failed</h4>
                        <p>Error: ${error.message}</p>
                    </div>
                `;
                log(`Authentication failed: ${error.message}`, 'error');
                return null;
            }
        }

        async function testMediaAPI() {
            const resultDiv = document.getElementById('media-result');
            resultDiv.innerHTML = '<p>Testing media API...</p>';
            
            if (!token) {
                resultDiv.innerHTML = '<div class="warning">⚠️ Please test authentication first</div>';
                return;
            }

            try {
                log('Testing media API...', 'info');
                
                const response = await fetch('http://localhost:8000/api/v1/media/?limit=5', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    mediaItems = data.items || [];
                    
                    let itemsHtml = '<h4>✅ Media API Working</h4>';
                    itemsHtml += `<p>Found ${mediaItems.length} items:</p><ul>`;
                    
                    mediaItems.forEach((item, index) => {
                        itemsHtml += `<li>${index + 1}. ${item.title} (ID: ${item.id})</li>`;
                    });
                    itemsHtml += '</ul>';
                    
                    resultDiv.innerHTML = `<div class="success">${itemsHtml}</div>`;
                    log(`Media API successful - ${mediaItems.length} items`, 'success');
                } else {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h4>❌ Media API Failed</h4>
                        <p>Error: ${error.message}</p>
                    </div>
                `;
                log(`Media API failed: ${error.message}`, 'error');
            }
        }

        async function testPosterURLs() {
            const resultDiv = document.getElementById('poster-result');
            resultDiv.innerHTML = '<p>Testing poster URLs...</p>';
            
            if (!token || mediaItems.length === 0) {
                resultDiv.innerHTML = '<div class="warning">⚠️ Please test authentication and media API first</div>';
                return;
            }

            let resultsHtml = '<h4>🖼️ Poster URL Test Results:</h4>';
            
            for (let i = 0; i < Math.min(3, mediaItems.length); i++) {
                const item = mediaItems[i];
                const posterUrl = `http://localhost:8000/api/v1/media/${item.id}/poster?token=${token}`;
                
                try {
                    log(`Testing poster for: ${item.title}`, 'info');
                    
                    const response = await fetch(posterUrl, { timeout: 5000 });
                    
                    if (response.ok) {
                        const contentType = response.headers.get('Content-Type');
                        const contentLength = response.headers.get('Content-Length');
                        
                        resultsHtml += `
                            <div class="success">
                                <strong>✅ ${item.title}</strong><br>
                                URL: ${posterUrl}<br>
                                Type: ${contentType}<br>
                                Size: ${contentLength} bytes
                            </div>
                        `;
                        log(`Poster OK for ${item.title}: ${contentType}`, 'success');
                    } else {
                        resultsHtml += `
                            <div class="error">
                                <strong>❌ ${item.title}</strong><br>
                                URL: ${posterUrl}<br>
                                Status: ${response.status} ${response.statusText}
                            </div>
                        `;
                        log(`Poster failed for ${item.title}: ${response.status}`, 'error');
                    }
                } catch (error) {
                    resultsHtml += `
                        <div class="error">
                            <strong>💥 ${item.title}</strong><br>
                            URL: ${posterUrl}<br>
                            Error: ${error.message}
                        </div>
                    `;
                    log(`Poster error for ${item.title}: ${error.message}`, 'error');
                }
            }
            
            resultDiv.innerHTML = resultsHtml;
            
            // Now test image loading
            testImageLoading();
        }

        function testImageLoading() {
            const imageTestArea = document.getElementById('image-test-area');
            imageTestArea.innerHTML = '<h4>🖼️ Visual Image Loading Test:</h4>';
            
            if (!token || mediaItems.length === 0) {
                imageTestArea.innerHTML += '<div class="warning">⚠️ No media items to test</div>';
                return;
            }

            mediaItems.slice(0, 3).forEach((item, index) => {
                const posterUrl = `http://localhost:8000/api/v1/media/${item.id}/poster?token=${token}`;
                
                const imageDiv = document.createElement('div');
                imageDiv.className = 'image-test';
                
                const img = document.createElement('img');
                img.src = posterUrl;
                img.alt = item.title;
                
                img.onload = function() {
                    log(`Image loaded successfully for: ${item.title}`, 'success');
                    imageDiv.style.border = '2px solid green';
                };
                
                img.onerror = function() {
                    log(`Image failed to load for: ${item.title}`, 'error');
                    imageDiv.style.border = '2px solid red';
                    img.src = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTUwIiBoZWlnaHQ9IjIyNSIgdmlld0JveD0iMCAwIDE1MCAyMjUiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIxNTAiIGhlaWdodD0iMjI1IiBmaWxsPSIjRjNGNEY2Ii8+CjxwYXRoIGQ9Ik03NSAxMTJMMTAwIDg3TDEyNSAxMTJMMTAwIDEzN0w3NSAxMTJaIiBmaWxsPSIjOUI5QkEwIi8+Cjx0ZXh0IHg9Ijc1IiB5PSIxNjAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IiM5QjlCQTAiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxMiI+Tm8gSW1hZ2U8L3RleHQ+Cjwvc3ZnPgo=';
                };
                
                const label = document.createElement('div');
                label.className = 'label';
                label.textContent = item.title.substring(0, 20) + (item.title.length > 20 ? '...' : '');
                
                imageDiv.appendChild(img);
                imageDiv.appendChild(label);
                imageTestArea.appendChild(imageDiv);
            });
        }

        function enableConsoleDebug() {
            const resultDiv = document.getElementById('console-result');
            
            // Override console methods to capture logs
            const originalLog = console.log;
            const originalError = console.error;
            const originalWarn = console.warn;
            
            console.log = function(...args) {
                originalLog.apply(console, args);
                log(`CONSOLE LOG: ${args.join(' ')}`, 'info');
            };
            
            console.error = function(...args) {
                originalError.apply(console, args);
                log(`CONSOLE ERROR: ${args.join(' ')}`, 'error');
            };
            
            console.warn = function(...args) {
                originalWarn.apply(console, args);
                log(`CONSOLE WARN: ${args.join(' ')}`, 'warning');
            };
            
            resultDiv.innerHTML = `
                <div class="info">
                    <h4>✅ Console Debug Enabled</h4>
                    <p>Console messages will now appear in the debug log below.</p>
                    <p>Open browser DevTools (F12) to see additional details.</p>
                </div>
            `;
            
            log('Console debugging enabled', 'info');
        }

        // Auto-start
        window.onload = function() {
            log('Poster display debug tool loaded', 'info');
            log('Step 1: Test authentication', 'info');
            log('Step 2: Test media API', 'info');
            log('Step 3: Test poster URLs', 'info');
            log('Step 4: Check visual image loading', 'info');
        };
    </script>
</body>
</html>
