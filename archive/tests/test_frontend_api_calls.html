<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #d1ecf1; color: #0c5460; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        #results { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Watch1 Frontend API Test</h1>
    <p>This page tests if the frontend can communicate with the backend API.</p>
    
    <div>
        <button onclick="testBackendHealth()">Test Backend Health</button>
        <button onclick="testLogin()">Test Login</button>
        <button onclick="testMediaAPI()">Test Media API</button>
        <button onclick="testAllEndpoints()">Test All</button>
    </div>
    
    <div id="results"></div>

    <script>
        const API_BASE = 'http://localhost:8000/api/v1';
        let authToken = null;

        function addResult(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            results.appendChild(div);
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        async function testBackendHealth() {
            addResult('Testing backend health...', 'info');
            try {
                const response = await fetch(`${API_BASE}/settings/test`);
                if (response.ok) {
                    addResult('✅ Backend is responding', 'success');
                } else {
                    addResult(`❌ Backend returned status ${response.status}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Backend connection failed: ${error.message}`, 'error');
            }
        }

        async function testLogin() {
            addResult('Testing login...', 'info');
            try {
                const response = await fetch(`${API_BASE}/auth/login/access-token`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: 'test@example.com',
                        password: 'testpass123'
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    authToken = data.access_token;
                    addResult(`✅ Login successful! Token: ${authToken.substring(0, 20)}...`, 'success');
                } else {
                    const errorText = await response.text();
                    addResult(`❌ Login failed: ${response.status} - ${errorText}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Login request failed: ${error.message}`, 'error');
            }
        }

        async function testMediaAPI() {
            if (!authToken) {
                addResult('❌ No auth token available. Please login first.', 'error');
                return;
            }

            addResult('Testing media API...', 'info');
            try {
                const response = await fetch(`${API_BASE}/media/`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    const itemCount = data.items ? data.items.length : 0;
                    addResult(`✅ Media API successful! Found ${itemCount} items (Total: ${data.total})`, 'success');
                    
                    if (itemCount > 0) {
                        const firstItem = data.items[0];
                        addResult(`📄 First item: ${firstItem.filename || firstItem.title || 'No title'}`, 'info');
                    }
                } else {
                    const errorText = await response.text();
                    addResult(`❌ Media API failed: ${response.status} - ${errorText}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Media API request failed: ${error.message}`, 'error');
            }
        }

        async function testAllEndpoints() {
            addResult('🚀 Running all tests...', 'info');
            await testBackendHealth();
            await new Promise(resolve => setTimeout(resolve, 500));
            await testLogin();
            await new Promise(resolve => setTimeout(resolve, 500));
            await testMediaAPI();
            addResult('✅ All tests completed!', 'success');
        }

        // Test CORS
        addResult('🌐 Testing CORS configuration...', 'info');
        fetch(`${API_BASE}/settings/test`, { method: 'OPTIONS' })
            .then(response => {
                if (response.ok) {
                    addResult('✅ CORS preflight successful', 'success');
                } else {
                    addResult('❌ CORS preflight failed', 'error');
                }
            })
            .catch(error => {
                addResult(`❌ CORS test failed: ${error.message}`, 'error');
            });
    </script>
</body>
</html>
