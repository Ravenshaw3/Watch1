
services:
  watch1-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: watch1-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /mnt/user/media:/app/media
      - /mnt/user/appdata/watch1/thumbnails:/app/thumbnails
      - /mnt/user/appdata/watch1/data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - MEDIA_ROOT=/app/media
      - THUMBNAILS_ROOT=/app/thumbnails
      - DATA_ROOT=/app/data
    networks:
      - watch1-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  watch1-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: watch1-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://watch1-backend:8000/api/v1
      - NODE_ENV=production
    depends_on:
      - watch1-backend
    networks:
      - watch1-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  watch1-nginx:
    image: nginx:alpine
    container_name: watch1-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - watch1-backend
      - watch1-frontend
    networks:
      - watch1-network

networks:
  watch1-network:
    driver: bridge

volumes:
  watch1-media:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/user/appdata/watch1/media
  watch1-thumbnails:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/user/appdata/watch1/thumbnails
  watch1-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/user/appdata/watch1/data