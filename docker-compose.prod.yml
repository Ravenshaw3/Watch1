
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: watch1-backend
    ports:
      - "8000:8000"
    volumes:
      - /mnt/user/media:/app/media:ro
      - /mnt/user/appdata/watch1/thumbnails:/app/thumbnails
      - /mnt/user/appdata/watch1/config:/config
      - /mnt/user/appdata/watch1/data:/app/data
      - /mnt/user/appdata/watch1/logs:/app/logs
      - /mnt/user/appdata/watch1/transcode:/app/transcode
    environment:
      - PYTHONPATH=/app
      - POSTGRES_HOST=watch1-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=watch1
      - POSTGRES_USER=watch1
      - POSTGRES_PASSWORD=watch1password 
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: watch1-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    restart: unless-stopped
    depends_on:
      - backend

  postgres:
    image: postgres:15-alpine
    container_name: watch1-postgres
    environment:
      - POSTGRES_DB=watch1
      - POSTGRES_USER=watch1
      - POSTGRES_PASSWORD=watch1password
    volumes:
      - /mnt/user/appdata/watch1/postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: watch1-redis
    volumes:
      - /mnt/user/appdata/watch1/redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
