
services:
  # PostgreSQL Database (Production-ready)
  database:
    image: postgres:15-alpine
    container_name: watch1-db-dev
    environment:
      POSTGRES_DB: watch1_dev
      POSTGRES_USER: watch1_user
      POSTGRES_PASSWORD: watch1_dev_password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watch1_user -d watch1_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - watch1-network

  # Redis Cache (For sessions and caching)
  redis:
    image: redis:7-alpine
    container_name: watch1-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - watch1-network

  # Backend API Server
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: watch1-backend-dev
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=true
      - DATABASE_URL=postgresql://watch1_user:watch1_dev_password@database:5432/watch1_dev
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=dev-jwt-secret-key-change-in-production
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
      # Mount Unraid server media share via mapped T: drive
      # T: is mapped to \\Tower\media on your system
      - T:/:/app/T:ro
      - ./thumbnails:/app/thumbnails
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/settings/test"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - watch1-network
    restart: unless-stopped

  # Frontend Development Server
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: watch1-frontend-dev
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8000/api/v1
      - VITE_WS_URL=ws://localhost:8000/ws
    ports:
      - "3000:3000"
    # volumes:
      # - ./frontend:/app:cached
      # - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - watch1-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: watch1-nginx-dev
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.dev.conf:/etc/nginx/nginx.conf
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - watch1-network
    restart: unless-stopped

  # Development Tools Container
  devtools:
    build:
      context: .
      dockerfile: docker/Dockerfile.devtools
    container_name: watch1-devtools-dev
    environment:
      - DATABASE_URL=postgresql://watch1_user:watch1_dev_password@database:5432/watch1_dev
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./tools:/app/tools
      - ./logs:/app/logs
      - ./scripts:/app/scripts
    depends_on:
      - database
      - redis
    networks:
      - watch1-network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  frontend_node_modules:
    driver: local

networks:
  watch1-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
